<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMWin WinGo (1 Min) Interactive Feed Engine</title>
    <style>
        :root {
            --bg-color: #050b08;
            --card-bg: #0b1712;
            --border-color: #00ff66;
            --text-main: #00ff66;
            --text-dim: #00b347;
            --alert-red: #ff3366;
            --alert-gold: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }

        .header {
            text-align: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.2rem;
            text-shadow: 0 0 8px var(--border-color);
        }

        .timer-box {
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .period-val { font-size: 1rem; color: #fff; font-weight: bold; }
        .countdown { font-size: 2rem; font-weight: bold; color: var(--border-color); }

        .prediction-card {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .pred-output { font-size: 1.8rem; font-weight: bold; margin: 8px 0; }
        .target-num {
            display: inline-block;
            background: var(--border-color);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .feed-section {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .feed-title {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-align: center;
        }

        .num-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .num-btn {
            background: #000;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .num-btn:hover { background: var(--border-color); color: #000; }

        .controls { display: flex; gap: 10px; margin-bottom: 15px; }

        .btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .btn-reverse.active { background: var(--alert-gold); color: #000; }

        .history-list {
            list-style: none;
            max-height: 100px;
            overflow-y: auto;
            font-size: 0.75rem;
            border-top: 1px dashed rgba(0, 255, 102, 0.2);
            padding-top: 8px;
        }

        .history-item { display: flex; justify-content: space-between; padding: 3px 0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>DMWin APEX FEED ENGINE</h1>
            <p>Live Pattern Learning Edition</p>
        </div>

        <div class="timer-box">
            <div>PERIOD INDEX</div>
            <div class="period-val" id="period-num">--</div>
            <div class="countdown" id="timer-sec">00:60</div>
        </div>

        <div class="prediction-card">
            <div style="font-size:0.75rem; color: var(--text-dim);">NEXT SIGNAL PREDICTION</div>
            <div class="pred-output" id="pred-category">WAITING INPUT</div>
            <div class="target-num" id="pred-target">TARGET: --</div>
        </div>

        <div class="feed-section">
            <div class="feed-title">ENTER ACTUAL DMWIN RESULT NUMBER</div>
            <div class="num-buttons">
                <button class="num-btn" onclick="feedResult(0)">0</button>
                <button class="num-btn" onclick="feedResult(1)">1</button>
                <button class="num-btn" onclick="feedResult(2)">2</button>
                <button class="num-btn" onclick="feedResult(3)">3</button>
                <button class="num-btn" onclick="feedResult(4)">4</button>
                <button class="num-btn" onclick="feedResult(5)">5</button>
                <button class="num-btn" onclick="feedResult(6)">6</button>
                <button class="num-btn" onclick="feedResult(7)">7</button>
                <button class="num-btn" onclick="feedResult(8)">8</button>
                <button class="num-btn" onclick="feedResult(9)">9</button>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-reverse" id="btn-toggle-mode" onclick="toggleMode()">MODE: NORMAL</button>
            <button class="btn" onclick="clearFeed()">RESET HISTORY</button>
        </div>

        <div>
            <div style="font-size:0.75rem; color:var(--text-dim); margin-bottom:5px;">FEED HISTORY LOG</div>
            <ul class="history-list" id="history-log">
                <li class="history-item"><span>No inputs added yet.</span></li>
            </ul>
        </div>
    </div>

    <script>
        let resultHistory = [];
        let isReverseMode = false;

        function getISTTime() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (3600000 * 5.5));
        }

        function updateClock() {
            const ist = getISTTime();
            const year = ist.getFullYear();
            const month = String(ist.getMonth() + 1).padStart(2, '0');
            const day = String(ist.getDate()).padStart(2, '0');
            const totalMinutes = ist.getHours() * 60 + ist.getMinutes();
            const periodStr = `${year}${month}${day}10001${String(totalMinutes).padStart(4, '0')}`;
            const seconds = 59 - ist.getSeconds();

            document.getElementById('period-num').innerText = periodStr;
            document.getElementById('timer-sec').innerText = `00:${String(seconds).padStart(2, '0')}`;
        }

        function feedResult(num) {
            const category = num >= 5 ? 'BIG' : 'SMALL';
            resultHistory.unshift({ num, category });
            if (resultHistory.length > 20) resultHistory.pop();
            
            updateHistoryLog();
            calculateNextSignal();
        }

        function calculateNextSignal() {
            if (resultHistory.length === 0) return;

            // Simple Markov / Frequency Calculation based on input stream
            let bigCount = 0;
            let smallCount = 0;
            
            resultHistory.forEach(r => {
                if (r.category === 'BIG') bigCount++;
                else smallCount++;
            });

            // Predict trend continuation or reversion
            let predictedCategory = (bigCount >= smallCount) ? 'SMALL' : 'BIG';
            let targetNum = (predictedCategory === 'BIG') ? 7 : 2;

            if (isReverseMode) {
                predictedCategory = (predictedCategory === 'BIG') ? 'SMALL' : 'BIG';
                targetNum = 9 - targetNum;
            }

            document.getElementById('pred-category').innerText = predictedCategory;
            document.getElementById('pred-category').style.color = (predictedCategory === 'BIG') ? '#00ff66' : '#ffcc00';
            document.getElementById('pred-target').innerText = `TARGET NUMBER: ${targetNum}`;
        }

        function updateHistoryLog() {
            const list = document.getElementById('history-log');
            list.innerHTML = '';
            resultHistory.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `<span>Round -${index + 1}: Entered [${item.num}]</span><span>${item.category}</span>`;
                list.appendChild(li);
            });
        }

        function toggleMode() {
            isReverseMode = !isReverseMode;
            const btn = document.getElementById('btn-toggle-mode');
            if (isReverseMode) {
                btn.innerText = 'MODE: REVERSE';
                btn.classList.add('active');
            } else {
                btn.innerText = 'MODE: NORMAL';
                btn.classList.remove('active');
            }
            calculateNextSignal();
        }

        function clearFeed() {
            resultHistory = [];
            document.getElementById('history-log').innerHTML = '<li class="history-item"><span>History cleared.</span></li>';
            document.getElementById('pred-category').innerText = 'WAITING INPUT';
            document.getElementById('pred-target').innerText = 'TARGET: --';
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
